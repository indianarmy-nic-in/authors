<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - 404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background Image with Blur & White Fade Overlay */
        body::before {
            content: "";
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            /* Yahan apni image ka URL dalein */
            background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj5At0sBXdE76mixSGtsQ2QwppnyqnnwWe-R03egLQ8n6e4kO_fQN1q2X2pROPqXxPOBCLqa90eRtSl0ODNHtCLTfy22eaYCQrueQbcSa3G1NgEaD3Gm3TRzRG9wKKLBeuEDMw5z20eGGvppzCJgsUyfwhdfKuPmBsAmYWzInMocMMWEc4U-z8eJbR6FIgE/s1600/Warm%20Orange%20Bokeh%20Light%20Background,%20Abstract%20Glow%20Gradient%20with%20Soft%20Particles%20Desktop%20Wallpaper.png');
            background-size: cover;
            background-position: center;
            filter: blur(1px);
            z-index: -1;
        }

        /* White Fade Layer to make text pop */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.55); /* White fade effect */
            z-index: -1;
        }

        .error-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: #2c3e50;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.05);
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a252f;
            margin-bottom: 15px;
        }

        .error-message {
            font-size: 1rem;
            color: #555555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .home-button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3498db;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 5px;
            transition: background-color 0.2s ease-in-out, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3);
        }

        .home-button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Oops! Page Not Found</h1>
        <p class="error-message">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <a href="https://authors.maniebook.online/" class="home-button">Back to Homepage</a>
    </div>

</body>
</html>
